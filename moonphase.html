<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Moon Phase Visualiser – Full Cycle</title>
    <style>
        body {
            background: #05070a;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        canvas {
            background: radial-gradient(circle, #1a1a1a 0%, #000 70%);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.05);
            margin-bottom: 30px;
        }
        .controls {
            background: #161b22;
            padding: 25px;
            border-radius: 16px;
            width: 340px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #f1c40f;
        }
        .value {
            float: right;
            color: #f1c40f;
            font-weight: bold;
        }
        .info {
            margin-top: 15px;
            font-size: 11px;
            color: #58a6ff;
            text-align: center;
            font-style: italic;
        }
        .phase-name {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #ffcc66;
        }
    </style>
</head>
<body>

    <canvas id="moonCanvas" width="320" height="320"></canvas>

    <div class="controls">
        <div class="group">
            <label>Phase Angle <span id="phaseVal" class="value">0°</span></label>
            <input type="range" id="phaseSlider" min="0" max="360" value="0" step="1">
        </div>
        <div class="group">
            <label>Latitude <span id="latVal" class="value">50°</span></label>
            <input type="range" id="latSlider" min="-90" max="90" value="50" step="1">
        </div>
        <div class="phase-name" id="phaseName">New Moon</div>
        <div class="info">🌕 Phase angle <br>0° = New, <br>90° = First Quarter, <br>180° = Full, <br>270° = Last Quarter</div>
    </div>

    <script>
        const canvas = document.getElementById('moonCanvas');
        const ctx = canvas.getContext('2d');
        const phaseSlider = document.getElementById('phaseSlider');
        const latSlider = document.getElementById('latSlider');
        const phaseVal = document.getElementById('phaseVal');
        const latVal = document.getElementById('latVal');
        const phaseNameSpan = document.getElementById('phaseName');

        const radius = 130;
        const centerX = 160;
        const centerY = 160;

        // Moon phase names based on angle (0-360)
        function getPhaseName(angle) {
            if (angle < 1 || angle > 359) return "New Moon";
            if (angle < 45) return "Waxing Crescent";
            if (angle < 90) return "Waxing Crescent";
            if (angle < 135) return "First Quarter";
            if (angle < 180) return "Waxing Gibbous";
            if (angle < 225) return "Full Moon";
            if (angle < 270) return "Waning Gibbous";
            if (angle < 315) return "Last Quarter";
            return "Waning Crescent";
        }

        function draw() {
            const phaseDeg = parseFloat(phaseSlider.value);
            const lat = parseFloat(latSlider.value);

            // Update displayed values
            phaseVal.innerText = phaseDeg + "°";
            latVal.innerText = lat + "°";
            phaseNameSpan.innerText = getPhaseName(phaseDeg);

            // Compute illumination (0-100%) from phase angle
            const phaseRad = phaseDeg * Math.PI / 180;
            const illumination = (1 - Math.cos(phaseRad)) / 2 * 100;

            // Determine waxing (0-180°) vs waning (180-360°)
            const isWaxing = phaseDeg < 180;
            // For crescent/gibbous orientation: waxing → top lit, waning → bottom lit
            // Use same logic as MoonRenderer in clock.js
            const useBottomSemicircle = !isWaxing && phaseDeg > 1 && phaseDeg < 359;

            ctx.clearRect(0, 0, 320, 320);
            ctx.save();
            ctx.translate(centerX, centerY);

            // Parallactic rotation based on latitude
            const rotation = -(lat * Math.PI / 180);
            ctx.rotate(rotation);

            // 1. Dark full moon base
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fillStyle = "#161b22";
            ctx.fill();

            // 2. Light semicircle (top for waxing, bottom for waning)
            let startAngle = useBottomSemicircle ? Math.PI : 0;
            let endAngle = useBottomSemicircle ? 2 * Math.PI : Math.PI;
            ctx.beginPath();
            ctx.arc(0, 0, radius, startAngle, endAngle, false);
            ctx.fillStyle = "#f1c40f";
            ctx.fill();

            // 3. Ellipse mask to create the terminator
            // wFactor = (illumination / 50) - 1  → at 0%: -1, at 100%: +1
            let wFactor = (illumination / 50) - 1;
            let ellipseHeight = Math.abs(radius * wFactor);
            ctx.beginPath();
            ctx.ellipse(0, 0, radius, ellipseHeight, 0, 0, Math.PI * 2);
            // For crescent (<50% illumination) we mask with dark, for gibbous (>50%) we mask with light
            ctx.fillStyle = illumination < 50 ? "#161b22" : "#f1c40f";
            ctx.fill();

            // Optional border
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(255,255,200,0.2)";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.restore();
        }

        phaseSlider.oninput = () => draw();
        latSlider.oninput = () => draw();
        draw();
    </script>
</body>
</html>
